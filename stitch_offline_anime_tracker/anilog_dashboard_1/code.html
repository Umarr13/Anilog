<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anilog Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Manrope:wght@200..800&amp;family=Work+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#f9f9f9",
                        "on-secondary-fixed": "#1b1c1c",
                        "background": "#f9f9f9",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "secondary-container": "#e3e2e2",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary": "#000000",
                        "primary-fixed": "#e5e2e1",
                        "inverse-surface": "#2f3131",
                        "on-surface": "#1a1c1c",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#e3e2e2",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e2e2e2",
                        "tertiary": "#000000",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-fixed-variant": "#474746",
                        "primary-container": "#1c1b1b",
                        "surface-tint": "#5f5e5e",
                        "on-secondary-container": "#646464",
                        "on-secondary-fixed-variant": "#464747",
                        "on-surface-variant": "#444748",
                        "inverse-primary": "#c8c6c5",
                        "surface-variant": "#e2e2e2",
                        "on-primary-fixed": "#1c1b1b",
                        "tertiary-container": "#1a1c1c",
                        "surface-container": "#eeeeee",
                        "on-primary-container": "#858383",
                        "secondary": "#5e5e5e",
                        "on-tertiary": "#ffffff",
                        "outline": "#747878",
                        "on-tertiary-fixed-variant": "#454747",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c4c7c7",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-tertiary-container": "#838484",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dadada",
                        "error": "#ba1a1a",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "margin-desktop": "64px",
                        "margin-mobile": "20px",
                        "stack-xl": "64px",
                        "stack-md": "24px",
                        "unit": "4px",
                        "stack-xs": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Work Sans"],
                        "body-sm": ["Work Sans"],
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "label-caps": ["Geist"],
                        "brand-logo": ["Geist"],
                        "headline-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "0px", "fontWeight": "400" }],
                        "body-sm": ["14px", { "lineHeight": "22px", "letterSpacing": "0px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "400" }],
                        "headline-lg-mobile": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "label-caps": ["10px", { "lineHeight": "12px", "letterSpacing": "0.15em", "fontWeight": "600" }],
                        "brand-logo": ["11px", { "lineHeight": "14px", "letterSpacing": "0.2em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "300" }]
                    }
                }
            }
        }
    </script>
<style>
        .progress-ring__circle {
            transition: stroke-dashoffset 1s ease-in-out;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-lg min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center w-full px-margin-mobile py-4 md:px-margin-desktop bg-transparent no-border flat no shadows transition-all duration-300 ease-in-out">
<div class="flex items-center">
<span class="font-brand-logo text-brand-logo tracking-[0.2em] uppercase text-on-surface dark:text-on-surface">ANILOG</span>
</div>
<!-- Desktop Nav (Hidden on Mobile) -->
<nav class="hidden md:flex gap-8">
<a class="text-primary dark:text-primary-fixed font-label-caps text-label-caps hover:opacity-70 transition-opacity" href="#">DASHBOARD</a>
<a class="text-secondary dark:text-secondary-fixed font-label-caps text-label-caps hover:opacity-70 transition-opacity" href="#">SEARCH</a>
<a class="text-secondary dark:text-secondary-fixed font-label-caps text-label-caps hover:opacity-70 transition-opacity" href="#">LIBRARY</a>
<a class="text-secondary dark:text-secondary-fixed font-label-caps text-label-caps hover:opacity-70 transition-opacity" href="#">PROFILE</a>
</nav>
</header>
<main class="pt-[100px] px-margin-mobile md:px-margin-desktop max-w-[1140px] mx-auto grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Current Sanity Gauge -->
<section class="col-span-1 md:col-span-5 flex flex-col items-start justify-center py-12 md:py-24">
<h2 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-primary mb-12">Mental State</h2>
<div class="relative w-64 h-64 mx-auto md:mx-0 flex items-center justify-center">
<svg class="w-full h-full" viewbox="0 0 120 120">
<circle class="text-surface-variant stroke-current" cx="60" cy="60" fill="transparent" r="54" stroke-width="2"></circle>
<circle class="text-primary stroke-current progress-ring__circle" cx="60" cy="60" fill="transparent" r="54" stroke-dasharray="339.292" stroke-dashoffset="84.823" stroke-linecap="round" stroke-width="2"></circle>
</svg>
<div class="absolute flex flex-col items-center justify-center text-center">
<span class="font-headline-lg text-headline-lg text-primary">75%</span>
<span class="font-label-caps text-label-caps text-on-surface-variant mt-2 uppercase tracking-widest">Stable</span>
</div>
</div>
</section>
<!-- Current Focus -->
<section class="col-span-1 md:col-span-7 flex flex-col justify-center py-12 md:py-24 space-y-stack-md">
<div class="flex justify-between items-end mb-4">
<h2 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg text-primary">Current Focus</h2>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Ep. 1042</span>
</div>
<div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-[0_40px_80px_rgba(0,0,0,0.04)] group">
<img alt="One Piece App Icon" class="w-full h-full object-cover grayscale opacity-80 group-hover:grayscale-0 group-hover:opacity-100 transition-all duration-700 ease-out" src="https://lh3.googleusercontent.com/aida/AP1WRLs3waCEaCw2CWmOiKRecjUEKe5HKfbUYmXR6PFifKSSUDnK2p6igcniOkSScYOSkgUg8IDr7zESJlLg0fuVD0XjTmK1Dk53oRNep-yjWSELKMHeBMvZmVPCKT9fRX7EgpCYqjPJK1OxSIDvklkMkOtTmwtNLqLJto2CnR-7xzE9MrqABmO0P05R6hFX6xrm7WP9yK2VH_aw3nVp0PAwd9nlMShyWO53VYYG3vT33ZSCMmyWIxmwlp3nXt8"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent"></div>
<div class="absolute bottom-6 left-6 right-6 flex justify-between items-end">
<div>
<h3 class="font-headline-md text-headline-md text-on-primary">One Piece</h3>
<p class="font-body-sm text-body-sm text-on-primary/80 mt-1">Wano Country Arc</p>
</div>
<button class="bg-surface/20 backdrop-blur-md border border-surface/30 text-on-primary px-6 py-3 rounded-full font-label-caps text-label-caps uppercase tracking-widest hover:bg-surface/40 hover:scale-105 active:scale-95 transition-all duration-300 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="play_arrow">play_arrow</span>
                        Resume
                    </button>
</div>
</div>
</section>
<!-- Quick Stats Grid -->
<section class="col-span-1 md:col-span-12 py-12 md:py-24 border-t border-surface-variant mt-12 md:mt-24">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-12">Performance</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
<!-- Stat 1 -->
<div class="p-8 rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_20px_40px_rgba(0,0,0,0.02)] flex flex-col justify-between h-48 hover:-translate-y-2 transition-transform duration-500 ease-out">
<span class="material-symbols-outlined text-on-surface-variant text-2xl" data-icon="visibility">visibility</span>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Total Watched</p>
<p class="font-headline-md text-headline-md text-primary">12,450 <span class="text-sm text-on-surface-variant">ep.</span></p>
</div>
</div>
<!-- Stat 2 -->
<div class="p-8 rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_20px_40px_rgba(0,0,0,0.02)] flex flex-col justify-between h-48 hover:-translate-y-2 transition-transform duration-500 ease-out delay-75">
<span class="material-symbols-outlined text-on-surface-variant text-2xl" data-icon="today">today</span>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Episodes Today</p>
<p class="font-headline-md text-headline-md text-primary">4</p>
</div>
</div>
<!-- Stat 3 -->
<div class="p-8 rounded-xl bg-surface-container-lowest border border-surface-variant shadow-[0_20px_40px_rgba(0,0,0,0.02)] flex flex-col justify-between h-48 hover:-translate-y-2 transition-transform duration-500 ease-out delay-150">
<span class="material-symbols-outlined text-on-surface-variant text-2xl" data-icon="star">star</span>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-2 uppercase">Score Average</p>
<p class="font-headline-md text-headline-md text-primary">8.4 <span class="text-sm text-on-surface-variant">/ 10</span></p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-8 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-md rounded-full bg-tertiary/80 dark:bg-tertiary-container/80 backdrop-blur-md shadow-xl no-border shadow-[0_20px_40px_rgba(0,0,0,0.04)] z-50 flex justify-around items-center px-6 py-4">
<button class="relative flex flex-col items-center justify-center scale-95 active:scale-90 transition-transform hover:opacity-100 text-on-surface dark:text-on-surface after:content-[''] after:absolute after:-bottom-2 after:w-1 after:h-1 after:bg-primary after:rounded-full">
<span class="material-symbols-outlined" data-icon="dashboard" data-weight="fill" style="font-variation-settings: 'FILL' 1;">dashboard</span>
</button>
<button class="flex flex-col items-center justify-center scale-95 active:scale-90 transition-transform hover:opacity-100 text-on-secondary-container dark:text-on-secondary-container opacity-50">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
<button class="flex flex-col items-center justify-center scale-95 active:scale-90 transition-transform hover:opacity-100 text-on-secondary-container dark:text-on-secondary-container opacity-50">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="flex flex-col items-center justify-center scale-95 active:scale-90 transition-transform hover:opacity-100 text-on-secondary-container dark:text-on-secondary-container opacity-50">
<span class="material-symbols-outlined" data-icon="library_books">library_books</span>
</button>
<button class="flex flex-col items-center justify-center scale-95 active:scale-90 transition-transform hover:opacity-100 text-on-secondary-container dark:text-on-secondary-container opacity-50">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</nav>
<script>
        // Simple script to ensure gauge animates on load
        document.addEventListener("DOMContentLoaded", () => {
            const circle = document.querySelector('.progress-ring__circle');
            if(circle) {
                // Force a reflow
                void circle.offsetWidth;
                // Set to 75%
                circle.style.strokeDashoffset = 339.292 - (339.292 * 0.75);
            }
        });
    </script>
</body></html>
