<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Anilog - Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#c8c6c5",
                        "surface-variant": "#e2e2e2",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#1c1b1b",
                        "surface-container-high": "#e8e8e8",
                        "inverse-primary": "#c8c6c5",
                        "background": "#f9f9f9",
                        "on-surface": "#1a1c1c",
                        "surface-bright": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f3f3f4",
                        "on-secondary-fixed-variant": "#93000d",
                        "outline": "#747878",
                        "secondary-fixed-dim": "#ffb4ac",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#ffdad6",
                        "on-tertiary-container": "#868381",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed-dim": "#cac6c3",
                        "surface-container": "#eeeeee",
                        "on-primary-fixed-variant": "#474646",
                        "inverse-surface": "#2f3131",
                        "surface-dim": "#dadada",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#484645",
                        "on-secondary-fixed": "#410002",
                        "secondary": "#b7131a",
                        "primary-container": "#1c1b1b",
                        "on-primary-container": "#858383",
                        "surface-tint": "#5f5e5e",
                        "primary-fixed": "#e5e2e1",
                        "tertiary": "#000000",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "primary": "#000000",
                        "inverse-on-surface": "#f0f1f1",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed": "#e6e1df",
                        "outline-variant": "#c4c7c7",
                        "on-error": "#ffffff",
                        "surface": "#f9f9f9",
                        "surface-container-highest": "#e2e2e2",
                        "on-surface-variant": "#444748",
                        "secondary-container": "#db322f",
                        "on-tertiary-fixed": "#1c1b1a",
                        "tertiary-container": "#1c1b1a",
                        "on-secondary-container": "#fffbff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "container-padding": "24px",
                        "desktop-max-width": "1200px",
                        "gutter": "16px",
                        "island-gap": "32px"
                    },
                    "fontFamily": {
                        "label-sm": ["Bricolage Grotesque"],
                        "headline-xl": ["Bricolage Grotesque"],
                        "body-lg": ["Bricolage Grotesque"],
                        "headline-lg": ["Bricolage Grotesque"],
                        "label-md": ["Bricolage Grotesque"],
                        "headline-lg-mobile": ["Bricolage Grotesque"],
                        "body-md": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "headline-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            font-family: 'Bricolage Grotesque', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Island shadow utility */
        .island-shadow {
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        /* Ambient glowing progress bar */
        .progress-glow {
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="min-h-screen pb-32">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-container-padding py-4 bg-background dark:bg-background flat no shadows docked full-width top-0 z-40 sticky">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-on-primary-fixed" data-weight="fill" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg font-black text-primary dark:text-on-primary-fixed uppercase tracking-widest">
            ANILOG
        </h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="max-w-desktop-max-width mx-auto px-gutter md:px-container-padding pt-island-gap flex flex-col gap-island-gap">
<!-- Sanity Gauge Island -->
<section class="bg-surface-container-lowest rounded-2xl island-shadow p-8 flex flex-col items-center justify-center">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest mb-6">Current Sanity</h2>
<div class="relative w-48 h-48 flex items-center justify-center">
<!-- Circular progress track -->
<svg class="w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle class="text-surface-container-high" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-width="2"></circle>
<!-- Progress (approx 75%) -->
<circle class="text-primary transition-all duration-1000 ease-out" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="70" stroke-width="4"></circle>
</svg>
<div class="absolute flex flex-col items-center">
<span class="font-headline-xl text-headline-xl text-primary">75%</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Stable</span>
</div>
</div>
</section>
<!-- Current Focus Island -->
<section class="bg-surface-container-lowest rounded-2xl island-shadow p-6 md:p-8 flex flex-col md:flex-row gap-8 items-center">
<!-- Image Area -->
<div class="w-full md:w-1/2 aspect-square md:aspect-auto md:h-80 rounded-xl overflow-hidden bg-surface-container relative flex-shrink-0">
<img alt="Current Focus Artwork" class="w-full h-full object-cover object-top mix-blend-multiply" data-alt="Minimalist, high-contrast black and white line art of a manga character wearing a straw hat with a singular vibrant red band. The character is looking down, mostly in shadow, against a pure white background. The style is clean, sharp, and iconic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGEPj8ruR6qThUhUJ_arVntdOD_yw3kMrIVv3vDBtN8Dk6v99HKc2Tl4MAsKeiRtg8TWv0OXxRO8YtQAFXyIbWJLYCXp6Acw1RJculeqKJZFvvjkv2_1I_v4fb0xpwENY_sM-IRs-v0SK2RHmgW5sbu6paXV-wQWzE8ZGaS_W5GwrTfrmEMpVTKyD7ajpyniaRG5Rn-mlQlxVZoM24e83rfthNA4VBnZxmCHrszpQQRahxqh9tzWK0"/>
<div class="absolute inset-0 border border-outline-variant/10 rounded-xl pointer-events-none"></div>
</div>
<!-- Content Area -->
<div class="w-full md:w-1/2 flex flex-col items-start">
<div class="flex items-center gap-2 mb-4">
<span class="px-3 py-1 bg-surface-container text-primary font-label-sm text-label-sm rounded-[4px] uppercase tracking-wider">Currently Watching</span>
</div>
<h3 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">One Piece</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-md">
                    Arc: Egghead Island<br/>
                    Episode: 1093
                </p>
<button class="bg-primary text-on-primary font-label-md text-label-md py-4 px-8 rounded-lg hover:opacity-90 transition-opacity w-full md:w-auto flex items-center justify-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
                    Resume
                </button>
</div>
</section>
<!-- Quick Stats Bento -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-4">
<div class="bg-surface-container-lowest rounded-2xl island-shadow p-6 flex flex-col items-center text-center">
<span class="font-headline-lg text-headline-lg text-primary mb-1">12</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Completed</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl island-shadow p-6 flex flex-col items-center text-center">
<span class="font-headline-lg text-headline-lg text-primary mb-1">3</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Watching</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl island-shadow p-6 flex flex-col items-center text-center">
<span class="font-headline-lg text-headline-lg text-primary mb-1">45</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Plan to Watch</span>
</div>
<div class="bg-surface-container-lowest rounded-2xl island-shadow p-6 flex flex-col items-center text-center">
<span class="font-headline-lg text-headline-lg text-secondary mb-1">9.5</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Avg Score</span>
</div>
</section>
</main>
<!-- Bottom Navigation Bar -->
<nav class="bg-surface-container-lowest dark:bg-surface-container-lowest shadow-2xl dark:shadow-none border border-outline-variant/20 fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md rounded-full z-50 flex justify-around items-center h-20 px-4 mb-4 mx-auto md:hidden">
<!-- Dashboard (Active) -->
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary font-bold hover:bg-surface-container-low rounded-full transition-colors w-16 h-16 scale-90 transition-transform duration-150" href="#">
<span class="material-symbols-outlined" data-icon="dashboard" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">Dashboard</span>
</a>
<!-- Search -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors w-16 h-16" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-sm text-label-sm mt-1">Search</span>
</a>
<!-- Add -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors w-16 h-16" href="#">
<span class="material-symbols-outlined" data-icon="add">add</span>
<span class="font-label-sm text-label-sm mt-1">Add</span>
</a>
<!-- Collection -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors w-16 h-16" href="#">
<span class="material-symbols-outlined" data-icon="library_books">library_books</span>
<span class="font-label-sm text-label-sm mt-1">Collection</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-low rounded-full transition-colors w-16 h-16" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
</body></html>
