name: Build & Release APK

on:
  push:
    tags:
      - 'v*'   # Triggers on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write  # Required to create GitHub Releases

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/anilog-release.jks

      - name: Create keystore.properties
        run: |
          cat > android/keystore.properties << EOF
          storeFile=anilog-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/Anilog-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Anilog ${{ github.ref_name }}"
          body: |
            ## Anilog ${{ github.ref_name }}

            Download the APK below and sideload it on your Android device.

            ### Installation
            1. Download `Anilog-${{ github.ref_name }}.apk`
            2. On your Android device, enable **Settings → Install unknown apps**
            3. Open the APK file to install
          files: |
            android/app/build/outputs/apk/release/Anilog-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
